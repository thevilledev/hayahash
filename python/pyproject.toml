[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hayahash"
version = "0.5.0"
description = "hayahash64 and hayahash128; CPython C extension over the C reference"
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.9"
authors = [
  { name = "Ville Vesilehto", email = "ville@vesilehto.fi" },
]
keywords = ["hash", "hashing", "non-cryptographic", "hayahash", "hayahash64", "hayahash128"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: The Unlicense (Unlicense)",
  "Operating System :: OS Independent",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thevilledev/hayahash"
Repository = "https://github.com/thevilledev/hayahash"
Issues = "https://github.com/thevilledev/hayahash/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = [
  "ruff==0.16.2",
  "pyright==1.1.411",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hayahash = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["hayahash"]

[tool.pyright]
include = ["src", "tests", "setup.py"]
extraPaths = ["src"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
# The _hayahash module is a C extension; only the .pyi stub is typed.
reportMissingModuleSource = false

# Portable binary wheels for PyPI. The release workflow runs cibuildwheel
# from the repository root with package-dir=python so {package} is this
# directory. Skip interpreters and ABIs this CPython extension does not
# target; keep manylinux + musllinux (and the host macOS/Windows builds).
[tool.cibuildwheel]
build = "cp*"
# PyPy/GraalPy are off by default; only skip selectors for enabled groups.
skip = [
  "cp3??t-*",
  "*-win32",
  "*-win_arm64",
  "*-*linux_i686",
  "*-musllinux_i686",
  "*-*linux_ppc64le",
  "*-*linux_s390x",
  "*-*linux_armv7l",
  "*-*linux_riscv64",
]
test-requires = ["pytest>=8"]
test-command = "pytest {package}/tests"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
