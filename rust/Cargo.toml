[package]
name = "hayahash"
version = "0.4.4"
edition = "2021"
license = "Unlicense"
authors = ["Ville Vesilehto <ville@vesilehto.fi>"]
description = "Rust implementation of the hayahash64 hash function"
repository = "https://github.com/thevilledev/hayahash"
readme = "../README.md"
keywords = ["hash", "hayahash", "fast-hash", "non-cryptographic"]
categories = ["algorithms", "no-std"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, optional = true }

[features]
default = ["std"]
# Use std::collections for the HayaHashMap/HayaHashSet aliases and
# enable the buffering HayaHasher (requires an allocator).
std = []
# Use hashbrown for the aliases instead; works on no_std targets with
# an allocator. Takes precedence over "std" when both are enabled.
hashbrown = ["dep:hashbrown"]
