name: Release

# One annotated tag (vX.Y.Z) releases every port: npm and crates.io
# via trusted publishing, the Go module via a derived go/vX.Y.Z tag,
# Zig and C via GitHub release assets, Python sdist + cibuildwheel
# binary wheels (PyPI once PUBLISH_PYPI is enabled), and (once
# enabled) Maven Central and NuGet. Versions are kept in lockstep
# across all ports; the check job refuses to release if any manifest
# disagrees with the tag.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Version consistency
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify every manifest matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$2" != "$tag" ]; then
              echo "::error::$1 is at version '$2' but the tag says '$tag'"
              fail=1
            fi
          }
          check VERSION \
            "$(tr -d ' \n' < VERSION)"
          check js/package.json \
            "$(jq -r .version js/package.json)"
          check rust/Cargo.toml \
            "$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml)"
          check zig/build.zig.zon \
            "$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",$/\1/p' zig/build.zig.zon)"
          # The first <version> element in the pom is the project version.
          check java/pom.xml \
            "$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' java/pom.xml | head -n1)"
          check csharp/src/Hayahash/Hayahash.csproj \
            "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' csharp/src/Hayahash/Hayahash.csproj | head -n1)"
          check python/pyproject.toml \
            "$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml)"
          check swift/Package.swift \
            "$(sed -n 's/^\/\/ hayahash-version: \(.*\)$/\1/p' swift/Package.swift)"
          exit "$fail"

  npm:
    name: Publish to npm
    needs: check
    # npm trusted publishing only works on GitHub-hosted runners. The
    # self-hosted images also point npm at a pull-through cache, which you
    # can install through but not publish to (ENEEDAUTH against the mirror).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@11.5.1 # zizmor: ignore[adhoc-packages] -- trusted publishing minimum

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Test
        run: npm test
        working-directory: js

      - name: Publish
        run: npm publish
        working-directory: js

  crates:
    name: Publish to crates.io
    needs: check
    # crates.io trusted publishing, like npm's, is designed for
    # GitHub-hosted runners. The self-hosted images also replace the
    # crates-io source with a pull-through cache, and cargo refuses to
    # publish through a replaced source.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        run: cargo publish --manifest-path rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  go-tag:
    name: Tag Go module
    needs: check
    runs-on: avrea-ubuntu-latest-2-vcpu
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes the derived tag back to the repository.
          persist-credentials: true

      # A Go module in a subdirectory is only versioned by tags
      # prefixed with that subdirectory: go/vX.Y.Z.
      - name: Push derived go/ tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/go/${GITHUB_REF_NAME}" >/dev/null; then
            echo "go/${GITHUB_REF_NAME} already exists"
          else
            git tag "go/${GITHUB_REF_NAME}" HEAD
            git push origin "refs/tags/go/${GITHUB_REF_NAME}"
          fi

      # Fetching the version once makes the module proxy mirror it
      # permanently and triggers pkg.go.dev indexing; it also fails
      # loudly if the module does not resolve.
      - name: Warm the Go module proxy
        run: |
          curl -fsS --retry 5 --retry-delay 15 \
            "https://proxy.golang.org/github.com/thevilledev/hayahash/go/@v/${GITHUB_REF_NAME}.info"

  github-release:
    name: GitHub release
    needs: check
    runs-on: avrea-ubuntu-latest-2-vcpu
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The zig and swift tarballs exist because package managers cannot
      # address a subdirectory inside a repository archive; the header
      # is a courtesy for C users.
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="hayahash-zig-${version}/" \
            -o "hayahash-zig-${version}.tar.gz" "${GITHUB_REF_NAME}:zig"
          git archive --format=tar.gz --prefix="hayahash-swift-${version}/" \
            -o "hayahash-swift-${version}.tar.gz" "${GITHUB_REF_NAME}:swift"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "hayahash ${GITHUB_REF_NAME}" --generate-notes \
              hayahash.h "hayahash-zig-${version}.tar.gz" \
              "hayahash-swift-${version}.tar.gz"
          fi

  # Source distribution only. Binary wheels are produced by cibuildwheel
  # below so PyPI gets portable manylinux/musllinux (and Win/macOS) tags
  # instead of a host-local linux_x86_64 wheel that PyPI would reject.
  pypi-sdist:
    name: Build Python sdist
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Sync vendored header and build sdist
        run: |
          diff -q ../hayahash.h include/hayahash.h
          python -m pip install -U pip build
          python -m pip install -e ".[test]"
          pytest -q
          python -m build --sdist
        working-directory: python

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  pypi-wheels:
    name: Build Python wheels (${{ matrix.os }})
    needs: check
    # cibuildwheel needs Docker on Linux and the native toolchains on
    # macOS/Windows; GitHub-hosted runners provide all of that.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check vendored header matches the C reference
        run: diff -q hayahash.h python/include/hayahash.h
        shell: bash

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [pypi-sdist, pypi-wheels]
    # Flip the repository variable PUBLISH_PYPI to 'true' once a PyPI
    # Trusted Publisher is configured for this workflow (release.yml).
    if: vars.PUBLISH_PYPI == 'true'
    # PyPI trusted publishing is designed for GitHub-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  nuget:
    name: Publish to NuGet
    needs: check
    # Flip the repository variable PUBLISH_NUGET to 'true' once a
    # nuget.org Trusted Publishing policy is configured for this
    # workflow and the NUGET_USER secret holds the nuget.org username.
    if: vars.PUBLISH_NUGET == 'true'
    # NuGet trusted publishing, like npm's, is designed for
    # GitHub-hosted runners.
    runs-on: avrea-ubuntu-latest-2-vcpu
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test --configuration Release --verbosity minimal
        working-directory: csharp

      - name: Pack
        run: >-
          dotnet pack src/Hayahash/Hayahash.csproj
          --configuration Release
          --output "$RUNNER_TEMP/nuget"
        working-directory: csharp

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        run: >-
          dotnet nuget push "$RUNNER_TEMP/nuget/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  maven:
    name: Publish to Maven Central
    needs: check
    # Flip the repository variable PUBLISH_MAVEN to 'true' once the
    # Central namespace is verified, the MAVEN_GPG_KEY_FINGERPRINT
    # variable is set, and the MAVEN_CENTRAL_USERNAME,
    # MAVEN_CENTRAL_PASSWORD, MAVEN_GPG_KEY, and MAVEN_GPG_PASSPHRASE
    # secrets are configured.
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No gpg-private-key input: the release profile signs with the
      # plugin's BouncyCastle signer, which reads the key from the
      # environment instead of a keyring.
      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      # Central rejects a deployment whose signatures reference a key
      # it cannot find, after the upload. Failing here instead keeps
      # a forgotten key upload from burning a version number.
      - name: Verify the signing key is on a public keyserver
        env:
          FINGERPRINT: ${{ vars.MAVEN_GPG_KEY_FINGERPRINT }}
        run: |
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::repository variable MAVEN_GPG_KEY_FINGERPRINT is not set"
            exit 1
          fi
          for server in keyserver.ubuntu.com keys.openpgp.org; do
            if curl -fsS "https://${server}/pks/lookup?op=get&search=0x${FINGERPRINT}" |
                grep -q "BEGIN PGP PUBLIC KEY BLOCK"; then
              echo "public key found on ${server}"
              exit 0
            fi
          done
          echo "::error::public key ${FINGERPRINT} is not published to a keyserver Central checks"
          exit 1

      - name: Test
        run: mvn --batch-mode --no-transfer-progress verify
        working-directory: java

      - name: Deploy
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy
        working-directory: java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ vars.MAVEN_GPG_KEY_FINGERPRINT }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
