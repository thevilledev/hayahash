name: CI

# push is limited to main so same-repo PR branches do not also fire a
# duplicate push run alongside pull_request. Fork PRs only ever see
# pull_request, which is unchanged.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: GitHub Actions security
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: 1.28.0
          advanced-security: false
          annotations: true

  c:
    name: C (${{ matrix.compiler }})
    runs-on: avrea-ubuntu-latest-2-vcpu
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and run quality checks
        run: >-
          make -C tests
          CC="${{ matrix.compiler }}"
          ARCH=
          CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          run-quality

      # cli/check builds hayasum plus the one-shot oracle, replays the
      # committed fuzz corpus through the portable drivers, and runs the
      # functional harness in cli/tests/run.sh.
      - name: Build and test hayasum
        run: >-
          make -C cli
          CC="${{ matrix.compiler }}"
          CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          check

      - name: Check published test vectors match hayahash.h
        run: >-
          make -C test_vectors
          CC="${{ matrix.compiler }}"
          CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          check

      - name: Check header install and pkg-config
        run: make check-install

      # Keeps kat_haya.txt honest: it is the reference the MSVC job
      # diffs against, so it has to be regenerated here rather than
      # trusted.
      - name: Check digests match the committed KAT
        run: >-
          make -C tests/wasm
          CC="${{ matrix.compiler }}"
          CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          check-kat-haya

  # ASan + UBSan pin the "no UB" claim on the reference header. Keep
  # recover-off so the first finding fails the job instead of logging.
  c-sanitize:
    name: C (clang ASan+UBSan)
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and run quality checks under sanitizers
        run: >-
          make -C tests
          CC=clang
          ARCH=
          CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -fno-sanitize-recover=all"
          run-quality

      - name: Check digests match the committed KAT under sanitizers
        run: >-
          make -C tests/wasm
          CC=clang
          CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -fno-sanitize-recover=all"
          check-kat-haya

      # The CLI owns argv handling, a chunked reader and output
      # escaping, none of which the header harnesses touch. Its own
      # tests and corpus replay run under the same sanitizers.
      - name: Build and test hayasum under sanitizers
        run: >-
          make -C cli
          CC=clang
          CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -fno-sanitize-recover=all"
          check

  # hayahash.h is a C header that C++ projects include, but nothing here
  # compiled it as C++, so a construct that is valid C and not valid C++
  # could land unnoticed. These are the existing harnesses rebuilt with a
  # C++ compiler; between them they touch every public entry point,
  # including the streaming API. -x c++ is required because clang++
  # rejects a .c input under -Werror; it is a no-op for g++.
  cpp:
    name: C++ (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: avrea-ubuntu-latest-2-vcpu
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - g++
          - clang++
        std:
          - c++11
          - c++17

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check digests match the committed KAT
        run: >-
          make -C tests/wasm
          CC="${{ matrix.compiler }}"
          CFLAGS="-O2 -x c++ -std=${{ matrix.std }} -Wall -Wextra -Werror"
          check-kat-haya

      - name: Check published test vectors match hayahash.h
        run: >-
          make -C test_vectors
          CC="${{ matrix.compiler }}"
          CFLAGS="-O2 -x c++ -std=${{ matrix.std }} -Wall -Wextra -Werror"
          check

      - name: Check 128-bit and streaming paths
        run: >-
          make -C tests
          CC="${{ matrix.compiler }}"
          ARCH=
          CFLAGS="-O2 -x c++ -std=${{ matrix.std }} -Wall -Wextra -Werror"
          run-hash128

  # The CMake package has to stay interchangeable with `make install`,
  # not merely work: a distro picking one path over the other must get
  # the same header at the same place and the same .pc contents. So this
  # stages both and diffs them, then builds a consumer that resolves the
  # package through find_package rather than the source tree.
  cmake:
    name: C (CMake package)
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install via CMake and via make, and compare
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr
          DESTDIR="$PWD/stage-cmake" cmake --install build
          make install DESTDIR="$PWD/stage-make" PREFIX=/usr
          diff -u stage-make/usr/include/hayahash.h \
                  stage-cmake/usr/include/hayahash.h
          diff -u stage-make/usr/lib/pkgconfig/hayahash.pc \
                  stage-cmake/usr/lib/pkgconfig/hayahash.pc
          echo "OK: CMake and make install the same header and .pc"

      - name: Build a find_package consumer against the install
        run: |
          cmake -S tests/cmake -B consumer-build \
            -DCMAKE_PREFIX_PATH="$PWD/stage-cmake/usr"
          cmake --build consumer-build
          ./consumer-build/consumer

      - name: Check pkg-config resolves from the CMake install
        run: |
          version="$(tr -d ' \n' < VERSION)"
          export PKG_CONFIG_PATH="$PWD/stage-cmake/usr/lib/pkgconfig"
          pkg-config --exact-version="$version" hayahash
          test "$(pkg-config --variable=includedir hayahash)" = "/usr/include"
          echo "OK: pkg-config resolves hayahash $version"

  # Coverage-guided fuzzing of the three parts of hayasum that take
  # untrusted input: argv, the byte stream, and the file name that goes
  # back out on the digest line. Each target asserts invariants rather
  # than just looking for crashes, so a wrong answer fails as loudly as
  # a memory error. Longer runs live in fuzz.yml.
  cli-fuzz:
    name: hayasum fuzzing (libFuzzer)
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the clang sanitizer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      - name: Build the fuzz targets
        run: make -C cli fuzz

      - name: Fuzz
        run: make -C cli fuzz-run FUZZ_SECONDS=60

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hayasum-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: cli/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # MSVC x64 takes the compact dispatch and the one-block bulk loop;
  # this job pins its digests to the committed KAT and runs the
  # quality harness. Timing on shared runners is too noisy to gate,
  # so MSVC performance measurement stays a documented open item.
  msvc:
    name: C (MSVC x64)
    runs-on: avrea-windows-2025-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and run conformance checks
        shell: cmd # zizmor: ignore[misfeature] -- required for vcvars64.bat
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /O2 /W4 /WX /I. /DKAT_HAYA_ONLY tests\wasm\kat_native.c /Fe:kat_msvc.exe || exit /b 1
          kat_msvc.exe > kat_msvc.txt || exit /b 1
          cl /nologo /std:c11 /O2 /W4 /WX /I. tests\quality.c tests\chibihash_v1.c /Fe:quality.exe || exit /b 1
          quality.exe haya || exit /b 1
          cl /nologo /std:c11 /O2 /W4 /WX /I. /D_CRT_SECURE_NO_WARNINGS cli\hayasum.c /Fe:hayasum.exe || exit /b 1

      # Only hayasum has a Windows-specific code path: stdin has to be
      # switched out of text mode or CRLF and Ctrl-Z would change the
      # digest of piped bytes. The fixture contains both.
      - name: Check hayasum reads stdin as binary
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("$PWD/crlf.bin",
            [byte[]](0x61, 0x0d, 0x0a, 0x1a, 0x62, 0x0d, 0x0a, 0x63))
          $expected = "990cc8889a9d44c2"
          $viaFile = (& ./hayasum.exe crlf.bin).Split(" ")[0]
          $viaStdin = (cmd /c ".\hayasum.exe < crlf.bin").Split(" ")[0]
          Write-Host "file=$viaFile stdin=$viaStdin expected=$expected"
          if ($viaFile -ne $expected) {
            Write-Host "::error::MSVC hayasum file digest differs from the reference"
            exit 1
          }
          if ($viaStdin -ne $expected) {
            Write-Host "::error::MSVC hayasum mangles stdin; it is not in binary mode"
            exit 1
          }
          & ./hayasum.exe --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::hayasum --version failed"
            exit 1
          }

      - name: Check MSVC digests match the committed KAT
        shell: pwsh
        run: |
          $expected = Get-Content tests/wasm/kat_haya.txt
          $actual = Get-Content kat_msvc.txt
          if (($expected -join "`n") -ne ($actual -join "`n")) {
            Write-Host "MSVC x64 digests differ from the committed KAT:"
            Compare-Object $expected $actual -SyncWindow 0 | Format-Table
            exit 1
          }
          Write-Host "MSVC x64 digests match the committed KAT."

  # s390x is a real big-endian 64-bit target. Cross-compiling the KAT
  # with zig cc and running it under qemu-user pins the byte-swap
  # loaders: digests must match the little-endian reference vectors.
  # wasm32 already covers the ILP32 case; this covers endianness.
  s390x:
    name: C (s390x big-endian)
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install qemu-user for s390x
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Cross-compile and run KAT under qemu-s390x
        run: |
          zig cc -target s390x-linux-musl \
            -O2 -std=c11 -Wall -Wextra -Werror \
            -I. -DKAT_HAYA_ONLY \
            tests/wasm/kat_native.c -o kat_s390x
          file kat_s390x
          qemu-s390x ./kat_s390x > kat_s390x.txt

      - name: Check s390x digests match the committed KAT
        run: |
          if ! diff -u tests/wasm/kat_haya.txt kat_s390x.txt; then
            echo "::error::s390x digests differ from the little-endian KAT"
            exit 1
          fi
          echo "s390x digests match the committed KAT (endianness-independent)."

  rust:
    name: Rust
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      HAYAHASH_CORPUS: ${{ github.workspace }}/hayahash-differential.bin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the differential corpus
        uses: ./.github/actions/differential-corpus

      - name: Install Rust
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component clippy,rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Lint
        run: >-
          cargo clippy
          --manifest-path rust/Cargo.toml
          --all-targets
          --
          -D warnings

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

  go:
    name: Go
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      HAYAHASH_CORPUS: ${{ github.workspace }}/hayahash-differential.bin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the differential corpus
        uses: ./.github/actions/differential-corpus

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go/go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-only: true
          verify: true
          working-directory: go

      - name: Check formatting
        run: golangci-lint fmt --diff
        working-directory: go

      - name: Lint
        run: golangci-lint run
        working-directory: go

      - name: Test
        run: go test ./...
        working-directory: go

  zig:
    name: Zig
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      HAYAHASH_CORPUS: ${{ github.workspace }}/hayahash-differential.bin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the differential corpus
        uses: ./.github/actions/differential-corpus

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check zig

      - name: Test
        run: zig build test --summary all
        working-directory: zig

  java:
    name: Java
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      HAYAHASH_CORPUS: ${{ github.workspace }}/hayahash-differential.bin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the differential corpus
        uses: ./.github/actions/differential-corpus

      - name: Install Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Check formatting
        run: mvn --batch-mode --no-transfer-progress spotless:check
        working-directory: java

      - name: Test
        run: mvn --batch-mode --no-transfer-progress verify
        working-directory: java

  csharp:
    name: C#
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      HAYAHASH_CORPUS: ${{ github.workspace }}/hayahash-differential.bin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the differential corpus
        uses: ./.github/actions/differential-corpus

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity minimal
        working-directory: csharp

      - name: Test
        run: dotnet test --configuration Release --verbosity minimal
        working-directory: csharp

  python:
    name: Python
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      HAYAHASH_CORPUS: ${{ github.workspace }}/hayahash-differential.bin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the differential corpus
        uses: ./.github/actions/differential-corpus

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check vendored header matches the C reference
        run: diff -q hayahash.h python/include/hayahash.h

      - name: Ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.1"
          src: "python"

      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.1"
          args: "format --check"
          src: "python"

      - name: Install and test
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
          pytest -q
        working-directory: python

      - name: Pyright
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
        with:
          version: "1.1.411"
          working-directory: python

  # Smoke one Linux and one Windows wheel so the cibuildwheel path stays
  # green without waiting for a release tag. cp39-win_amd64 is intentional:
  # older CPython headers trip MSVC /W4 /WX unless treated as external.
  # The full matrix lives in release.yml.
  python-wheels:
    name: Python wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux smoke
            os: ubuntu-latest
            build: cp312-manylinux_x86_64
          - name: windows smoke
            os: windows-latest
            build: cp39-win_amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check vendored header matches the C reference
        run: diff -q hayahash.h python/include/hayahash.h
        shell: bash

      - name: Build ${{ matrix.build }}
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.build }}
        with:
          package-dir: python
          output-dir: wheelhouse

  swift:
    name: Swift
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      HAYAHASH_CORPUS: ${{ github.workspace }}/hayahash-differential.bin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the differential corpus
        uses: ./.github/actions/differential-corpus

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0.3"

      - name: Test
        run: swift test
        working-directory: swift

  js:
    name: JavaScript
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      HAYAHASH_CORPUS: ${{ github.workspace }}/hayahash-differential.bin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the differential corpus
        uses: ./.github/actions/differential-corpus

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      # Rebuild from hayahash.h so a stale committed wasm binary cannot
      # stay green after the C reference changes.
      - name: Check committed wasm is rebuilt from the C reference
        run: |
          npm run build:wasm
          git diff --exit-code -- wasm/hayahash.wasm src/wasm-module.ts
        working-directory: js

      - name: Test
        run: npm test
        working-directory: js

  # Cross-compile the MIPS64 assembly port and run the shared KAT under
  # qemu-user. Pins endian-independent LE loads and the n64 ABI entry.
  mips:
    name: MIPS64 assembly
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mips64el toolchain and qemu-user
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          gcc-mips64el-linux-gnuabi64
          qemu-user

      - name: Build and run known-answer tests
        run: make -C mips test
