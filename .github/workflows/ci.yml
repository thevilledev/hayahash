name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c:
    name: C (${{ matrix.compiler }})
    runs-on: avrea-ubuntu-latest-2-vcpu
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and run quality checks
        run: >-
          make -C tests
          CC="${{ matrix.compiler }}"
          ARCH=
          CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          run-quality

  rust:
    name: Rust
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component clippy,rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Lint
        run: >-
          cargo clippy
          --manifest-path rust/Cargo.toml
          --all-targets
          --
          -D warnings

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

  go:
    name: Go
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Check formatting
        run: |
          test -z "$(gofmt -l go)" || { gofmt -d go; exit 1; }

      - name: Lint
        run: go vet -C go ./...

      - name: Test
        run: go test -C go ./...

  zig:
    name: Zig
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check zig

      - name: Test
        run: zig build test --summary all
        working-directory: zig

  java:
    name: Java
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Test
        run: mvn --batch-mode --no-transfer-progress test
        working-directory: java

  js:
    name: JavaScript
    runs-on: avrea-ubuntu-latest-2-vcpu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Check committed wasm embed is current
        run: |
          npm run build:embed
          git diff --exit-code -- src/wasm-module.ts
        working-directory: js

      - name: Test
        run: npm test
        working-directory: js
