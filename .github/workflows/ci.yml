name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c:
    name: C (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and run quality checks
        run: >-
          make -C tests
          CC="${{ matrix.compiler }}"
          ARCH=
          CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          run-quality

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component clippy,rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Lint
        run: >-
          cargo clippy
          --manifest-path rust/Cargo.toml
          --all-targets
          --
          -D warnings

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check formatting
        run: |
          test -z "$(gofmt -l go)" || { gofmt -d go; exit 1; }

      - name: Lint
        run: go vet -C go ./...

      - name: Test
        run: go test -C go ./...

  zig:
    name: Zig
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check zig

      - name: Test
        run: zig build test --summary all
        working-directory: zig
