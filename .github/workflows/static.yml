# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The playground's content-versioned bundle stays out of git. It
      # contains the npm package modules and the shootout wasm module.
      # The wasm embeds rapidhash (MIT) and xxHash (BSD-2), fetched at
      # pinned commits, so it is built here and never committed.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build playground artifacts
        run: scripts/build-playground.sh
      - name: Verify the shootout module against a native build
        run: make -C tests/wasm run-kat
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload the static site and its generated, versioned assets.
          path: 'website'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      # Hashed assets are immutable and must not be purged. Clear only the
      # mutable HTML/manifest entry points and the temporary compatibility
      # aliases used by browsers that cached the old HTML shell.
      - name: Purge mutable Cloudflare URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::error::Set the CLOUDFLARE_ZONE_ID repository secret."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{
              "files": [
                "https://hayaha.sh/playground.html",
                "https://hayaha.sh/playground-assets.json",
                "https://hayaha.sh/playground.js",
                "https://hayaha.sh/bench.wasm",
                "https://hayaha.sh/vendor/index.js",
                "https://hayaha.sh/vendor/pure.js",
                "https://hayaha.sh/vendor/wasm.js",
                "https://hayaha.sh/vendor/wasm-module.js",
                "https://hayaha.sh/vendor/kat.txt"
              ]
            }')"

          if ! printf '%s' "$response" | jq -e '.success == true' >/dev/null; then
            echo "::error::Cloudflare rejected the cache purge."
            printf '%s\n' "$response" | jq -c '{errors, messages}'
            exit 1
          fi
